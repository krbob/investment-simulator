name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ci-required
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          build-scan-publish: false

      - name: Test engine, Portfolio adapter and API; build CLI
        run: ./gradlew --no-daemon --stacktrace test installDist

      - name: Test Portfolio scripts with synthetic local HTTP fixtures
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Verify distributed CLI and OpenAPI contract
        run: |
          set -euo pipefail
          cli=build/install/investment-simulator/bin/investment-simulator
          "$cli" compare examples/migration.json > "$RUNNER_TEMP/comparison.json"
          "$cli" openapi > "$RUNNER_TEMP/openapi.json"

          python3 - <<'PY'
          from decimal import Decimal
          import json
          import os
          from pathlib import Path
          import subprocess

          temporary = Path(os.environ["RUNNER_TEMP"])
          request = json.loads(Path("examples/migration.json").read_text())
          comparison = json.loads((temporary / "comparison.json").read_text())
          results = {item["strategyId"]: item for item in comparison["results"]}
          expected = {item["id"] for item in request["strategies"]}
          assert set(results) == expected, "CLI did not compare every requested strategy"
          assert comparison["baselineStrategyId"] == request["baselineStrategyId"]
          assert comparison["preferredStrategyId"] in results
          assert comparison["explanation"], "CLI must explain the recommendation"

          baseline = results[request["baselineStrategyId"]]
          assert Decimal(baseline["advantageVsBaselinePln"]) == 0
          for strategy_id in ("move-half", "move-all"):
              transfer = results[strategy_id]["initialTransfer"]
              assert transfer["direction"] == "TAXABLE_TO_OKI"
              assert Decimal(transfer["estimatedAdditionalCapitalGainsTaxPln"]) > 0

          packaged_contract = json.loads((temporary / "openapi.json").read_text())
          source_contract = json.loads(Path("openapi/investment-simulator-v1.json").read_text())
          assert packaged_contract == source_contract, "Packaged OpenAPI contract is stale"

          cli = "build/install/investment-simulator/bin/investment-simulator"

          def run_cli(command, payload, expected_exit=0, extra_args=()):
              completed = subprocess.run(
                  [cli, command, "-", *extra_args], input=json.dumps(payload),
                  text=True, capture_output=True, timeout=180,
              )
              assert completed.returncode == expected_exit, completed.stderr
              return json.loads(completed.stdout)

          portfolio_request = json.loads(Path("examples/portfolio-analysis.json").read_text())
          analysis = run_cli("analyze-portfolio", portfolio_request)
          assert analysis["status"] == "COMPLETE", analysis["dataGaps"]
          assert not analysis["dataGaps"]
          analysis_results = {item["strategyId"]: item for item in analysis["comparison"]["results"]}
          assert set(analysis_results) == {
              "keep-taxable", "new-money-oki", "move-quarter-to-oki",
              "move-half-to-oki", "move-all-to-oki",
          }
          for strategy_id in ("move-quarter-to-oki", "move-half-to-oki", "move-all-to-oki"):
              transfer = analysis_results[strategy_id]["initialTransfer"]
              assert transfer["direction"] == "TAXABLE_TO_OKI"
              assert Decimal(transfer["estimatedAdditionalCapitalGainsTaxPln"]) > 0

          replay = run_cli("compare", analysis["resolvedRequest"])
          assert replay == analysis["comparison"], "Resolved request does not reproduce the analysis"

          del portfolio_request["portfolio"]["openingTaxState"]
          incomplete = run_cli("analyze-portfolio", portfolio_request, expected_exit=3)
          assert incomplete["status"] == "NEEDS_INPUT"
          assert "MISSING_TAX_STATE" in {gap["code"] for gap in incomplete["dataGaps"]}
          assert incomplete.get("comparison") is None, "Missing tax data must block recommendations"
          assert incomplete.get("resolvedRequest") is None

          sensitivity_request = json.loads(Path("examples/sensitivity.json").read_text())
          sensitivity = run_cli("sensitivity", sensitivity_request)
          assert sensitivity["scenarioCount"] == len(sensitivity["scenarios"]) > 1
          assert sensitivity["strategySummaries"]
          assert sensitivity["limitations"]
          sensitivity_json = temporary / "sensitivity.json"
          sensitivity_json.write_text(json.dumps(sensitivity))
          subprocess.run([
              "python3", "scripts/render-sensitivity.py", "--input", str(sensitivity_json),
              "--output", str(temporary / "sensitivity.html"),
          ], check=True, timeout=30)
          scenario = sensitivity["scenarios"][-1]
          resolved = run_cli("sensitivity-scenario", sensitivity_request, extra_args=(scenario["id"],))
          assert resolved["endDate"] == scenario["coordinates"]["endDate"]
          replay = run_cli("compare", resolved)
          replay_results = {item["strategyId"]: item for item in replay["results"]}
          assert replay["recommendation"] == scenario["recommendation"]
          if scenario["preferredStrategyId"] is not None:
              assert replay["preferredStrategyId"] == scenario["preferredStrategyId"]
          for summary in scenario["strategies"]:
              full = replay_results[summary["strategyId"]]
              for key, value in summary.items():
                  if key in full:
                      assert value == full[key], f"Sensitivity replay changed {summary['strategyId']}.{key}"

          invalid_grid = dict(sensitivity_request, axes={"equityReturnRateShifts": [index / 1000 for index in range(17)]})
          rejected = subprocess.run(
              [cli, "sensitivity", "-"], input=json.dumps(invalid_grid),
              text=True, capture_output=True, timeout=30,
          )
          assert rejected.returncode == 2, rejected.stderr
          assert not rejected.stdout, "Invalid sensitivity grid must not emit a partial report"
          assert rejected.stderr.startswith("Error:")
          print("Distributed CLI verified migration tax, Portfolio analysis, sensitivity replay, rejected incomplete inputs and OpenAPI.")
          PY
